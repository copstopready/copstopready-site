<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CopStopReady - Know your rights. Record encounters. Fight tickets. Privacy-first. No servers.">
  <title>CopStopReady</title>
  <link rel="stylesheet" href="/nav.css">
  <script src="/nav.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      min-height: 100vh;
    }
    .brand {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
      line-height: 1.1;
    }
    .brand .copstop { color: #fff; }
    .brand .ready { color: #e53935; }
    .tagline {
      font-size: 18px;
      color: #aaa;
      margin-bottom: 48px;
      max-width: 480px;
      line-height: 1.5;
    }
    .status {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .promise {
      font-size: 16px;
      color: #fff;
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 48px;
      padding: 24px;
      border: 1px solid #222;
      border-radius: 8px;
    }
    .promise strong { color: #e53935; }
    .links {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      padding: 12px 24px;
      border: 1px solid #444;
      border-radius: 4px;
      transition: border-color 0.2s, color 0.2s;
    }
    .links a:hover { border-color: #e53935; color: #e53935; }
    footer {
      margin-top: 64px;
      font-size: 12px;
      color: #555;
    }
    @media (max-width: 480px) {
      .brand { font-size: 36px; }
      .tagline { font-size: 16px; }
      .promise { font-size: 14px; padding: 20px; }
    }
  </style>
</head>
<body>
  <nav id="csr-nav"></nav>
  <div class="brand"><span class="copstop">COPSTOP</span><span class="ready">READY</span></div>
  <div class="tagline">Know your rights. Record encounters. Fight tickets.</div>
  <div class="status">Coming soon to Google Play</div>
  <div class="promise">
    <strong>Nothing leaves your phone. Ever.</strong><br><br>
    No servers. No analytics. No telemetry. Every recording, every document, every scan stays on your device.
  </div>
  <div class="links">
    <a href="/privacy/">Privacy Policy</a>
    <a href="mailto:support@copstopready.com">Contact</a>
  </div>
  <footer>&copy; 2026 CopStopReady. All rights reserved.</footer>
</body>
</html>
